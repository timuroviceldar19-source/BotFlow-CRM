[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "botflow-crm-bot-api"
version = "0.1.0"
description = "Bot-first acquisition funnel backend powered by FastAPI and aiogram."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.22.0,<4.0.0",
  "alembic>=1.16.0,<2.0.0",
  "fastapi>=0.116.0,<1.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "sqlalchemy>=2.0.38,<3.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "aiosqlite>=0.21.0,<1.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "pydantic-settings>=2.10.0,<3.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
