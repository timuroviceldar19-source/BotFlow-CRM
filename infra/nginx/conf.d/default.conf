upstream web_backend {
    server web:3000;
}

upstream api_backend {
    server bot-api:8000;
}

# ── Redirect HTTP → HTTPS ──
server {
    listen 80;
    server_name _;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Nginx healthcheck (used by Docker)
    location = /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Redirect everything else to HTTPS
    # Comment out the return 301 line and uncomment proxy rules below
    # if you haven't set up SSL yet (first deploy without certs)
    # return 301 https://$host$request_uri;

    # ── Temporary HTTP-only mode (remove after SSL setup) ──

    # API endpoints (admin, stats, verifications)
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Partner webhooks
    location /api/webhooks/ {
        limit_req zone=webhooks burst=10 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded screenshots
    location /uploads/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1h;
    }

    # API healthcheck
    location = /api/health {
        proxy_pass http://api_backend/health;
    }

    # Everything else → Next.js
    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://web_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Next.js HMR (dev) and server actions
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

